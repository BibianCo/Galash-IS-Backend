name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize test database
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/auth_test?sslmode=disable
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/init.sql

      - name: Run all Go tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/auth_test?sslmode=disable
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...
