openapi: 3.0.3
info:
  title: GALASH UPTC API
  version: 1.0.0
  description: |
    API HTTP del Sistema de Información y Gestión Académica GALASH UPTC.
    Las operaciones protegidas aceptan `Authorization: Bearer <Firebase ID token>`.
  contact:
    name: Equipo GALASH UPTC
servers:
  - url: http://localhost:8080
    description: Desarrollo local
tags:
  - name: Health
  - name: Auth
  - name: Users and members
  - name: Seedbeds
  - name: Registration
  - name: Research
  - name: Events
  - name: Content
  - name: Announcements
  - name: Calendar
  - name: Links
  - name: Audit
  - name: Files
paths:
  /health: {get: {tags: [Health], summary: Estado del servicio, operationId: health, responses: {'200': {description: Servicio disponible}}}}
  /auth/register: {post: {tags: [Auth], summary: Registrar usuario, operationId: register, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}, responses: {'201': {description: Usuario registrado}, '400': {$ref: '#/components/responses/BadRequest'}}}}
  /auth/register/matches: {get: {tags: [Auth], summary: Buscar cuentas importadas compatibles, operationId: registerMatches, responses: {'200': {description: Coincidencias encontradas}}}}
  /auth/sessions: {post: {tags: [Auth], summary: Crear sesión, operationId: createSession, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionRequest'}}}}, responses: {'201': {description: Sesión creada}, '401': {$ref: '#/components/responses/Unauthorized'}}}}
  /auth/sessions/current: {delete: {tags: [Auth], summary: Cerrar sesión actual, operationId: deleteSession, security: [{bearerAuth: []}], responses: {'204': {description: Sesión cerrada}, '401': {$ref: '#/components/responses/Unauthorized'}}}}
  /users/me: {get: {tags: [Users and members], summary: Obtener perfil actual, operationId: currentUser, security: [{bearerAuth: []}], responses: {'200': {description: Perfil del usuario}, '401': {$ref: '#/components/responses/Unauthorized'}}}}
  /users/me/photo: {put: {tags: [Users and members], summary: Actualizar URL de foto, operationId: setProfilePhoto, security: [{bearerAuth: []}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [photo_url], properties: {photo_url: {type: string, format: uri}}}}}}, responses: {'200': {description: Foto actualizada}, '400': {$ref: '#/components/responses/BadRequest'}}}}
  /members: {get: {tags: [Users and members], summary: Listar integrantes públicos, operationId: listMembers, parameters: [{in: query, name: q, schema: {type: string}}], responses: {'200': {description: Integrantes}}}, post: {tags: [Users and members], summary: Crear integrante administrativo, operationId: createMember, security: [{bearerAuth: []}], responses: {'201': {description: Integrante creado}, '403': {$ref: '#/components/responses/Forbidden'}}}}
  /members/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Users and members], summary: Detallar integrante, operationId: getMember, responses: {'200': {description: Integrante}}}, patch: {tags: [Users and members], summary: Editar integrante, operationId: updateMember, security: [{bearerAuth: []}], responses: {'200': {description: Integrante actualizado}}}}
  /members/{id}/status: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], patch: {tags: [Users and members], summary: Cambiar estado del integrante, operationId: setMemberStatus, security: [{bearerAuth: []}], responses: {'200': {description: Estado actualizado}}}}
  /members/{id}/publications: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Users and members], summary: Publicaciones visibles del integrante, operationId: memberPublications, responses: {'200': {description: Publicaciones}}}}
  /admin/members: {get: {tags: [Users and members], summary: Buscar integrantes administrativamente, operationId: adminMembers, security: [{bearerAuth: []}], parameters: [{in: query, name: q, schema: {type: string}}], responses: {'200': {description: Integrantes administrativos}, '403': {$ref: '#/components/responses/Forbidden'}}}}
  /users/roles: {put: {tags: [Users and members], summary: Actualizar rol por encabezado selected-uid, operationId: updateRoleByHeader, security: [{bearerAuth: []}], responses: {'200': {description: Rol actualizado}}}}
  /users/{userId}/roles: {parameters: [{in: path, name: userId, required: true, schema: {type: string}}], put: {tags: [Users and members], summary: Actualizar rol, operationId: updateRole, security: [{bearerAuth: []}], responses: {'200': {description: Rol actualizado}}}}
  /seedbeds: {get: {tags: [Seedbeds], summary: Listar semilleros, operationId: listSeedbeds, responses: {'200': {description: Semilleros}}}, post: {tags: [Seedbeds], summary: Crear semillero, operationId: createSeedbed, security: [{bearerAuth: []}], responses: {'201': {description: Semillero creado}}}}
  /seedbeds/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Seedbeds], summary: Detallar semillero, operationId: getSeedbed, responses: {'200': {description: Semillero}}}, patch: {tags: [Seedbeds], summary: Editar semillero, operationId: updateSeedbed, security: [{bearerAuth: []}], responses: {'200': {description: Semillero actualizado}}}}
  /seedbeds/{id}/space: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Seedbeds], summary: Vista compuesta del semillero, operationId: getSeedbedSpace, responses: {'200': {description: Espacio del semillero}}}}
  /seedbeds/{id}/visibility: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], patch: {tags: [Seedbeds], summary: Cambiar visibilidad, operationId: setSeedbedVisibility, security: [{bearerAuth: []}], responses: {'200': {description: Visibilidad actualizada}}}}
  /seedbeds/{id}/members: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Seedbeds], summary: Listar miembros, operationId: listSeedbedMembers, responses: {'200': {description: Miembros}}}, post: {tags: [Seedbeds], summary: Inscribir miembro, operationId: addSeedbedMember, security: [{bearerAuth: []}], responses: {'201': {description: Miembro inscrito}}}}
  /seedbeds/{id}/members/{userId}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: path, name: userId, required: true, schema: {type: string}}], delete: {tags: [Seedbeds], summary: Retirar miembro, operationId: removeSeedbedMember, security: [{bearerAuth: []}], responses: {'204': {description: Miembro retirado}}}}
  /seedbeds/{id}/delegates: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], put: {tags: [Seedbeds], summary: Asignar delegados, operationId: setSeedbedDelegates, security: [{bearerAuth: []}], responses: {'200': {description: Delegados actualizados}}}}
  /registration-requests: {post: {tags: [Registration], summary: Radicar solicitud de registro, operationId: createRegistration, security: [{bearerAuth: []}], responses: {'201': {description: Solicitud creada}}}}
  /registration-requests/{id}/status: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Registration], summary: Consultar estado propio, operationId: registrationStatus, security: [{bearerAuth: []}], responses: {'200': {description: Estado}}}}
  /admin/registration-requests: {get: {tags: [Registration], summary: Listar solicitudes, operationId: listRegistrationRequests, security: [{bearerAuth: []}], responses: {'200': {description: Solicitudes}}}}
  /admin/registration-requests/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Registration], summary: Detallar solicitud, operationId: registrationDetail, security: [{bearerAuth: []}], responses: {'200': {description: Solicitud}}}}
  /admin/registration-requests/{id}/status: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], patch: {tags: [Registration], summary: Actualizar estado de solicitud, operationId: updateRegistrationStatus, security: [{bearerAuth: []}], responses: {'200': {description: Estado actualizado}}}}
  /seedbeds/{seedbedId}/activities: {parameters: [{in: path, name: seedbedId, required: true, schema: {type: string}}], get: {tags: [Research], summary: Listar actividades, operationId: listActivities, responses: {'200': {description: Actividades}}}, post: {tags: [Research], summary: Crear actividad, operationId: createActivity, security: [{bearerAuth: []}], responses: {'201': {description: Actividad creada}}}}
  /activities/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Research], summary: Detallar actividad, operationId: getActivity, responses: {'200': {description: Actividad}}}, patch: {tags: [Research], summary: Editar actividad, operationId: updateActivity, security: [{bearerAuth: []}], responses: {'200': {description: Actividad actualizada}}}}
  /projects: {get: {tags: [Research], summary: Listar proyectos, operationId: listProjects, responses: {'200': {description: Proyectos}}}, post: {tags: [Research], summary: Crear proyecto, operationId: createProject, security: [{bearerAuth: []}], responses: {'201': {description: Proyecto creado}}}}
  /projects/progress: {get: {tags: [Research], summary: Consultar progreso global, operationId: projectProgress, security: [{bearerAuth: []}], responses: {'200': {description: Progreso}}}}
  /projects/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Research], summary: Detallar proyecto, operationId: getProject, responses: {'200': {description: Proyecto}}}, patch: {tags: [Research], summary: Editar proyecto, operationId: updateProject, security: [{bearerAuth: []}], responses: {'200': {description: Proyecto actualizado}}}}
  /projects/{id}/progress: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], patch: {tags: [Research], summary: Actualizar progreso, operationId: updateProgress, security: [{bearerAuth: []}], responses: {'200': {description: Progreso actualizado}}}}
  /projects/{id}/history: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Research], summary: Historial del proyecto, operationId: projectHistory, responses: {'200': {description: Historial}}}}
  /research-proposals: {get: {tags: [Research], summary: Listar propuestas, operationId: listProposals, security: [{bearerAuth: []}], responses: {'200': {description: Propuestas}}}, post: {tags: [Research], summary: Crear propuesta, operationId: createProposal, security: [{bearerAuth: []}], responses: {'201': {description: Propuesta creada}}}}
  /research-proposals/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Research], summary: Detallar propuesta, operationId: getProposal, security: [{bearerAuth: []}], responses: {'200': {description: Propuesta}}}, patch: {tags: [Research], summary: Editar propuesta, operationId: updateProposal, security: [{bearerAuth: []}], responses: {'200': {description: Propuesta actualizada}}}}
  /research-proposals/{id}/convert-to-project: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], post: {tags: [Research], summary: Convertir propuesta en proyecto, operationId: convertProposal, security: [{bearerAuth: []}], responses: {'201': {description: Proyecto creado}}}}
  /seedbeds/{seedbedId}/reviews: {parameters: [{in: path, name: seedbedId, required: true, schema: {type: string}}], get: {tags: [Research], summary: Listar reseñas publicadas, operationId: publishedReviews, responses: {'200': {description: Reseñas}}}, post: {tags: [Research], summary: Crear reseña, operationId: createReview, security: [{bearerAuth: []}], responses: {'201': {description: Reseña creada}}}}
  /admin/seedbed-reviews: {get: {tags: [Research], summary: Listar reseñas para moderación, operationId: listReviews, security: [{bearerAuth: []}], responses: {'200': {description: Reseñas}}}}
  /admin/seedbed-reviews/{id}/moderation: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], patch: {tags: [Research], summary: Moderar reseña, operationId: moderateReview, security: [{bearerAuth: []}], responses: {'200': {description: Reseña moderada}}}}
  /events: {get: {tags: [Events], summary: Listar eventos, operationId: listEvents, responses: {'200': {description: Eventos}}}, post: {tags: [Events], summary: Crear evento, operationId: createEvent, security: [{bearerAuth: []}], responses: {'201': {description: Evento creado}}}}
  /events/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Events], summary: Detallar evento, operationId: getEvent, responses: {'200': {description: Evento}}}, patch: {tags: [Events], summary: Editar evento, operationId: updateEvent, security: [{bearerAuth: []}], responses: {'200': {description: Evento actualizado}}}}
  /events/{id}/publish: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], post: {tags: [Events], summary: Publicar evento, operationId: publishEvent, security: [{bearerAuth: []}], responses: {'200': {description: Evento publicado}}}}
  /events/{id}/cancel: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], post: {tags: [Events], summary: Cancelar evento, operationId: cancelEvent, security: [{bearerAuth: []}], responses: {'200': {description: Evento cancelado}}}}
  /events/{id}/hide: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], post: {tags: [Events], summary: Ocultar evento, operationId: hideEvent, security: [{bearerAuth: []}], responses: {'200': {description: Evento ocultado}}}}
  /content/pages: {get: {tags: [Content], summary: Listar páginas publicadas, operationId: listPublishedPages, responses: {'200': {description: Páginas}}}}
  /content/pages/{slug}: {parameters: [{in: path, name: slug, required: true, schema: {type: string}}], get: {tags: [Content], summary: Obtener página publicada, operationId: getPublishedPage, responses: {'200': {description: Página}}}}
  /admin/content/pages: {get: {tags: [Content], summary: Listar páginas administrativas, operationId: listAdminPages, security: [{bearerAuth: []}], responses: {'200': {description: Páginas}}}, post: {tags: [Content], summary: Crear página, operationId: createPage, security: [{bearerAuth: []}], responses: {'201': {description: Página creada}}}}
  /admin/content/pages/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], patch: {tags: [Content], summary: Editar página, operationId: updatePage, security: [{bearerAuth: []}], responses: {'200': {description: Página actualizada}}}}
  /admin/content/pages/{id}/publish: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], post: {tags: [Content], summary: Publicar página, operationId: publishPage, security: [{bearerAuth: []}], responses: {'200': {description: Página publicada}}}}
  /announcements: {get: {tags: [Announcements], summary: Listar comunicados, operationId: listAnnouncements, security: [{bearerAuth: []}], responses: {'200': {description: Comunicados}}}, post: {tags: [Announcements], summary: Crear comunicado, operationId: createAnnouncement, security: [{bearerAuth: []}], responses: {'201': {description: Comunicado creado}}}}
  /announcements/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Announcements], summary: Detallar comunicado, operationId: getAnnouncement, security: [{bearerAuth: []}], responses: {'200': {description: Comunicado}}}, patch: {tags: [Announcements], summary: Editar comunicado, operationId: updateAnnouncement, security: [{bearerAuth: []}], responses: {'200': {description: Comunicado actualizado}}}}
  /announcements/{id}/publish: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], post: {tags: [Announcements], summary: Publicar comunicado, operationId: publishAnnouncement, security: [{bearerAuth: []}], responses: {'200': {description: Comunicado publicado}}}}
  /announcements/{id}/read-confirmations: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], post: {tags: [Announcements], summary: Confirmar lectura, operationId: confirmAnnouncementRead, security: [{bearerAuth: []}], responses: {'204': {description: Lectura confirmada}}}}
  /announcements/{id}/read-status: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Announcements], summary: Estado de lectura, operationId: announcementReadStatus, security: [{bearerAuth: []}], responses: {'200': {description: Estado de lectura}}}}
  /internal-calendar/events: {get: {tags: [Calendar], summary: Listar cronograma interno, operationId: listInternalCalendar, security: [{bearerAuth: []}], responses: {'200': {description: Eventos del cronograma}}}, post: {tags: [Calendar], summary: Crear evento del cronograma, operationId: createInternalCalendar, security: [{bearerAuth: []}], responses: {'201': {description: Evento creado}}}}
  /internal-calendar/events/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Calendar], summary: Detallar evento del cronograma, operationId: getInternalCalendar, security: [{bearerAuth: []}], responses: {'200': {description: Evento}}}, patch: {tags: [Calendar], summary: Actualizar evento del cronograma, operationId: updateInternalCalendar, security: [{bearerAuth: []}], responses: {'200': {description: Evento actualizado}}}, delete: {tags: [Calendar], summary: Cancelar evento del cronograma, operationId: deleteInternalCalendar, security: [{bearerAuth: []}], responses: {'204': {description: Evento cancelado}}}}
  /links: {get: {tags: [Links], summary: Listar enlaces oficiales, operationId: listOfficialLinks, responses: {'200': {description: Enlaces}}}, post: {tags: [Links], summary: Crear enlace oficial, operationId: createOfficialLink, security: [{bearerAuth: []}], responses: {'201': {description: Enlace creado}}}}
  /links/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], patch: {tags: [Links], summary: Editar enlace oficial, operationId: updateOfficialLink, security: [{bearerAuth: []}], responses: {'200': {description: Enlace actualizado}}}}
  /links/{id}/status: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], patch: {tags: [Links], summary: Cambiar estado de enlace, operationId: updateOfficialLinkStatus, security: [{bearerAuth: []}], responses: {'200': {description: Estado actualizado}}}}
  /audit-logs: {get: {tags: [Audit], summary: Consultar auditoría, operationId: listAuditLogs, security: [{bearerAuth: []}], responses: {'200': {description: Registros de auditoría}, '403': {$ref: '#/components/responses/Forbidden'}}}}
  /files: {post: {tags: [Files], summary: Cargar archivo asociado, operationId: uploadFile, security: [{bearerAuth: []}], requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}, entity_type: {type: string}, entity_id: {type: string}}}}}}, responses: {'201': {description: Archivo cargado}, '413': {description: Archivo mayor de 10 MB}}}}
  /files/{id}: {parameters: [{in: path, name: id, required: true, schema: {type: string}}], get: {tags: [Files], summary: Descargar archivo autorizado, operationId: getFile, security: [{bearerAuth: []}], responses: {'200': {description: Contenido binario, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-token}
  schemas:
    RegisterRequest: {type: object, required: [nombre, apellido, tipo_dni, dni, email, fecha_nacimiento, telefono], properties: {nombre: {type: string}, apellido: {type: string}, tipo_dni: {type: string}, dni: {type: string}, email: {type: string, format: email}, codigo_estudiantil: {type: string}, fecha_nacimiento: {type: string, format: date}, telefono: {type: string}, claim_id: {type: string}}}
    SessionRequest: {type: object, required: [token], properties: {token: {type: string}}}
    Error: {type: object, properties: {error: {type: string}}}
  responses:
    BadRequest: {description: Solicitud inválida, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Sesión requerida o inválida, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permisos insuficientes, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
